# 防晒品类种子关键词 —— Stage1 search.list 输入。
#
# 规模依据：action_camera 用 46 个种子词 + type=channel 二次搜索才堆到 2083 个
# 频道。search.list 每次最多返回 50 条，去重与「≥15 个视频、频道年龄 ≥90 天」
# 的过滤会砍掉相当一部分，所以要够到 2000+ 必须有 45 条量级的词表，18 条不够。
#
# 配额：search.list 单价 100 units，48 条 = 4800 units；加上每频道
# playlistItems/videos 各约 1 unit，2000 个频道约 4000 units，合计约 8800 units，
# 在每日 10000 的硬顶内 —— 但一天基本只够跑一个品类。
#
# 选词逻辑覆盖三类达人，它们不是同一批人，但都是防晒的真实受众：
#   护肤/成分类 —— 会拆解成分与肤感，但日照场景弱
#   户外场景类 —— 有真实日照暴露与补涂需求，但未必讲成分
#   亲子/家庭类 —— 儿童防晒的决策人群
# 与 action_camera 的冲浪/滑雪频道会有部分重合，采集时按 channel_id 去重，
# 不会重复计费。

# 垂类标签的英文名 —— 前端只显示英文（YouTube 原生的频道名/视频标题除外），
# 而 vertical 是中文的内部标签，所以每个品类必须在这里声明对应的英文展示名。
# 这是固定词表，不需要 LLM 翻译（与 build-linkverse.mjs 里 camera_perspective /
# narrative_pace 的处理方式一致）。新增垂类时必须同步补一行，否则前端会拿不到
# 英文名而显示 null。
verticals:
  "护肤测评": "Skincare Reviews"
  "成分科普": "Ingredient Science"
  "美妆日常": "Beauty & Daily Routine"
  "海滨户外": "Beach & Coastal"
  "山地户外": "Mountain Outdoors"
  "雪地户外": "Snow Outdoors"
  "户外护肤": "Outdoor Skincare"
  "亲子户外": "Family Outdoors"
  "旅行生活": "Travel Lifestyle"

