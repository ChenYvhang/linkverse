# 运动补剂品类种子关键词 —— Stage1 search.list 输入。
#
# 规模依据同防晒品类：要够到 2000+ 个频道需要 45 条量级的词表，18 条不够。
# 配额：48 条 × 100 = 4800 units，加上每频道约 2 units，2000 个频道合计约
# 8800 units，在每日 10000 的硬顶内，但一天只够跑一个品类。
#
# 覆盖四类达人：
#   力量/增肌 —— 蛋白粉与肌酸的核心受众
#   耐力 —— 电解质的核心受众
#   营养科普 —— 科学严谨度高，适合成分导向的产品
#   女性健身/家庭健身 —— 补剂品类实际受众里长期被低估的一块
#
# 合规提醒：补剂在多数市场受健康声称监管，Stage5 生成话术时不得出现疗效承诺。

# 垂类标签的英文名 —— 前端只显示英文（YouTube 原生的频道名/视频标题除外），
# 而 vertical 是中文的内部标签，所以每个品类必须在这里声明对应的英文展示名。
# 这是固定词表，不需要 LLM 翻译。新增垂类时必须同步补一行，否则前端会拿不到
# 英文名而显示 null。
verticals:
  "力量训练": "Strength Training"
  "健美": "Bodybuilding"
  "力量举": "Powerlifting"
  "增肌饮食": "Muscle-Gain Nutrition"
  "补剂测评": "Supplement Reviews"
  "营养科普": "Nutrition Science"
  "耐力跑": "Endurance Running"
  "铁人三项": "Triathlon"
  "耐力骑行": "Endurance Cycling"
  "综合体能": "Functional Fitness"
  "居家健身": "Home Fitness"
  "女性健身": "Women's Fitness"

